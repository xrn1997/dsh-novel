<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <style>
    text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','WenQuanYi Zen Hei','Segoe UI',sans-serif}
    .page{fill:#F5F6FA}
    .card{fill:#FFFFFF;stroke:#E6EAF7;stroke-width:1}
    .line{stroke:#EDF1F8;stroke-width:1}
    .chip{fill:#EEF1F6}
    .field{fill:#FBFCFE;stroke:#E6EAF7;stroke-width:1}
    .track{fill:#E9EDF5}
    .ink1{fill:#15171C}
    .ink2{fill:#38425A}
    .ink3{fill:#8A93A6}
    .stroke3{fill:none;stroke:#8A93A6;stroke-width:1}
    .ttsPill{fill:none;stroke:#8A93A6;stroke-width:1}
    .dashed{fill:none;stroke:#B7BFCF;stroke-width:1;stroke-dasharray:3 3}
    .brand{fill:#2F6FEB}
    .btn{fill:#15171C}
    .btnText{fill:#FFFFFF}
    .glyph{fill:#FFFFFF;opacity:.9}
    .cover1{fill:#3C4250}
    .cover2{fill:#3D4A42}
    .cover3{fill:#4D3A3A}
    .paper{fill:#F7F3E8}
    .paperInk{fill:#3A362C;opacity:.45}
    .paperTitle{fill:#8A8374}
    .paperRule{stroke:#D8D2C2;stroke-width:1}
    /* 纸色是阅读偏好，不随深浅主题走，两档同色；其余配色各给一档 */
    @media (prefers-color-scheme: dark){
      .page{fill:#141517}
      .card{fill:#1E1E20;stroke:#33363B}
      .line{stroke:#2F3237}
      .chip{fill:#2B2B2E}
      .field{fill:#242426;stroke:#3A3D42}
      .track{fill:#3A3D42}
      .ink1{fill:#F9FAFB}
      .ink2{fill:#CFD3D6}
      .ink3{fill:#ADB2B8}
      .stroke3{stroke:#ADB2B8}
      .ttsPill{stroke:#ADB2B8}
      .dashed{stroke:#6B7280}
      .btn{fill:#F9FAFB}
      .btnText{fill:#15171C}
    }
  </style>

  <rect class="page" width="640" height="300"/>
  <rect class="card" x="28" y="22" width="584" height="256" rx="14"/>
  <line class="line" x1="322" y1="22" x2="322" y2="278"/>

  <!-- 左半：书架 tab（三 tab 并列、聚合搜索入口、按最近阅读排序的封面卡） -->
  <rect class="chip" x="40" y="31" width="48" height="21" rx="6"/>
  <text class="ink1" x="64" y="46" font-size="12" font-weight="600" text-anchor="middle">书架</text>
  <text class="ink3" x="100" y="46" font-size="12">书城</text>
  <text class="ink3" x="134" y="46" font-size="12">书源管理</text>

  <text class="ink1" x="44" y="72" font-size="14" font-weight="600">书架</text>
  <text class="ink3" x="80" y="72" font-size="10">4 本</text>

  <rect class="field" x="44" y="82" width="150" height="18" rx="6"/>
  <circle class="stroke3" cx="56" cy="91" r="3.2"/>
  <line class="stroke3" x1="58.3" y1="93.3" x2="60.6" y2="95.6"/>
  <text class="ink3" x="66" y="94.5" font-size="9.5">搜书名 / 作者</text>
  <rect class="btn" x="202" y="82" width="36" height="18" rx="5"/>
  <text class="btnText" x="220" y="94.5" font-size="9.5" text-anchor="middle">搜索</text>
  <text class="ink3" x="244" y="94.5" font-size="9">聚合全部书源</text>

  <rect class="chip" x="44" y="108" width="30" height="16" rx="5"/>
  <text class="ink1" x="59" y="119.5" font-size="9.5" text-anchor="middle">全部</text>
  <text class="ink3" x="80" y="119.5" font-size="9.5">在读</text>
  <text class="ink3" x="105" y="119.5" font-size="9.5">未读</text>
  <text class="ink3" x="130" y="119.5" font-size="9.5">本地</text>
  <text class="ink3" x="160" y="119.5" font-size="9">最近阅读排序 · 进度自动保存</text>
  <line class="line" x1="40" y1="130" x2="306" y2="130"/>

  <rect class="cover1" x="44" y="142" width="60" height="84" rx="4"/>
  <text class="glyph" x="74" y="190" font-size="15" text-anchor="middle">书</text>
  <rect class="cover2" x="110" y="142" width="60" height="84" rx="4"/>
  <text class="glyph" x="140" y="190" font-size="15" text-anchor="middle">书</text>
  <rect class="cover3" x="176" y="142" width="60" height="84" rx="4"/>
  <text class="glyph" x="206" y="190" font-size="15" text-anchor="middle">书</text>
  <rect class="dashed" x="242" y="142" width="60" height="84" rx="4"/>
  <text class="ink3" x="272" y="190" font-size="14" text-anchor="middle">＋</text>

  <text class="ink1" x="44" y="238" font-size="9.5">书名 01</text>
  <text class="ink1" x="110" y="238" font-size="9.5">书名 02</text>
  <text class="ink1" x="176" y="238" font-size="9.5">书名 03</text>
  <text class="ink1" x="242" y="238" font-size="9">导入本地书籍</text>
  <rect class="track" x="44" y="245" width="56" height="3" rx="1.5"/>
  <rect class="brand" x="44" y="245" width="34" height="3" rx="1.5"/>
  <rect class="track" x="110" y="245" width="56" height="3" rx="1.5"/>
  <rect class="brand" x="110" y="245" width="9" height="3" rx="1.5"/>
  <text class="ink3" x="44" y="257" font-size="8.5">在读 · 61%</text>
  <text class="ink3" x="110" y="257" font-size="8.5">在读 · 16%</text>
  <text class="ink3" x="176" y="257" font-size="8.5">未开始</text>
  <text class="ink3" x="242" y="257" font-size="8">TXT / EPUB</text>

  <!-- 右半：阅读器（顶部返回与工具，纸色正文连续滚动，一章接一章） -->
  <text class="ink1" x="338" y="45" font-size="11">‹ 书架</text>
  <text class="ink3" x="376" y="45" font-size="9">示例书</text>
  <text class="ink2" x="478" y="45" font-size="10" text-anchor="end">下载</text>
  <text class="ink2" x="502" y="45" font-size="10" text-anchor="end">Aa</text>
  <text class="ink2" x="544" y="45" font-size="10" text-anchor="end">目录</text>
  <rect class="ttsPill" x="552" y="33" width="56" height="18" rx="9"/>
  <path class="stroke3" d="M565 43.5a4 4 0 0 1 8 0"/>
  <rect class="ink2" x="564.2" y="43.5" width="1.6" height="3.6" rx=".8"/>
  <rect class="ink2" x="572.2" y="43.5" width="1.6" height="3.6" rx=".8"/>
  <text class="ink2" x="578" y="45.5" font-size="9.5">听书</text>
  <line class="line" x1="326" y1="56" x2="612" y2="56"/>

  <rect class="paper" x="336" y="64" width="264" height="198" rx="8"/>
  <line class="paperRule" x1="356" y1="86" x2="420" y2="86"/>
  <text class="paperTitle" x="468" y="89" font-size="9" text-anchor="middle">第 12 章 · 示例章节</text>
  <line class="paperRule" x1="516" y1="86" x2="580" y2="86"/>
  <rect class="paperInk" x="356" y="100" width="224" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="112" width="206" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="124" width="224" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="136" width="172" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="148" width="224" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="160" width="196" height="4" rx="2"/>

  <line class="paperRule" x1="356" y1="182" x2="420" y2="182"/>
  <text class="paperTitle" x="468" y="185" font-size="9" text-anchor="middle">第 13 章 · 示例章节</text>
  <line class="paperRule" x1="516" y1="182" x2="580" y2="182"/>
  <rect class="paperInk" x="356" y="196" width="224" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="208" width="210" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="220" width="164" height="4" rx="2"/>
  <rect class="paperInk" x="356" y="232" width="120" height="4" rx="2"/>
</svg>
