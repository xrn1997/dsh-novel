name: CI

# 离线门：类型 / 规则 / 契约 / 打包 / compat 回放。
# 真链路门（REPROBE / CONTENT_AUDIT / SEARCH_FILTER_AUDIT / EPUB_BROWSER / WEBVIEW /
# INSTALL_CHECK）需要真实站点、真浏览器或本机宿主，刻意不进日常 CI；按
# docs/development.md 的命令在开发机上手动跑。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gates:
    name: Offline gates (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本住 package.json 的 packageManager；Node 版本在本文件与 release.yml 各写一次，升级时一起改。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Offline gates
        run: pnpm gates
